[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agentic-variation"
version = "0.4.0"
description = "An AVO-inspired long-horizon experiment controller for Hermes Agent."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "TheCodeOfDave" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
py-modules = ["contracts", "controller", "evaluator", "phase2", "phase3", "phase3_workspace", "runtime", "schemas", "state_machine", "storage", "tools"]

[tool.ruff]
target-version = "py311"
line-length = 100
