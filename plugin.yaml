manifest_version: 2
api_version: 1
name: agentic-variation
version: 0.3.0
description: AVO-inspired bounded continuation and supervision controller for Hermes Agent.
author: TheCodeOfDave
license: MIT
homepage: https://github.com/TheCodeOfDave/hermes-agentic-variation
tags: [agents, experimentation, evolutionary-search, phase-2]
config_schema:
  phase1_enabled:
    type: bool
    default: false
    description: Backend authority gate for one built-in no-tool Phase 1 fixture step.
  phase1_wait_seconds:
    type: int
    default: 120
    description: Bounded wait for the single Phase 1 child; valid range 5-180 seconds.
  phase2_enabled:
    type: bool
    default: false
    description: Backend authority gate for explicit bounded Phase 2 continuation tools.
  phase2_wait_seconds:
    type: int
    default: 120
    description: Bounded wait per Phase 2 variation or supervisor child; valid range 5-180 seconds.
  default_max_steps:
    type: int
    default: 5
    description: Default candidate-step ceiling for a future approved RunSpec.
  default_max_wall_seconds:
    type: int
    default: 600
    description: Default wall-clock budget for a future approved run.
  default_max_cost_usd:
    type: float
    default: 1.0
    description: Default model cost ceiling for a future approved run.
  default_no_progress_limit:
    type: int
    default: 2
    description: Non-improving attempts before future supervision is required.
  network_policy:
    type: str
    default: disabled
    description: Future-run network default; use disabled or allowlist.
  allowed_toolsets:
    type: list
    default: [file, terminal]
    description: Future child toolset ceiling; child authority can only narrow the parent.
  evaluator_id:
    type: str
    default: fixture.score.v1
    description: Immutable evaluator adapter identifier for a future RunSpec.
provides_tools:
  - avo_phase0_info
  - avo_validate_run_spec
  - avo_create_run
  - avo_step
  - avo_status
  - avo_cancel
  - avo_lineage
  - avo_create_phase2_run
  - avo_memory
  - avo_reconcile
  - avo_supervise
